[package]
name    = "bible-engine"
version = "0.1.0"
edition = "2021"

[features]
# Enable reading of standard CrossWire SWORD binary modules (.conf + rawText/zText/etc.)
# via the `sword-modules` crate (CC0-1.0).  Off by default to keep the core build lean;
# enable with  cargo build --features bible-engine/native-sword.
native-sword = ["dep:sword-modules"]

[dependencies]
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
bible-core   = { path = "../bible-core" }
text-parser  = { path = "../text-parser" }
sword-modules = { version = "0.1.0", optional = true, default-features = false, features = ["zip", "bzip2", "xz"] }
