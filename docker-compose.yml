services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - npm
      - start
      - --
      - --host
      - 0.0.0.0
      - --poll=2000
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  node_modules:
